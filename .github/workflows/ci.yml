name: build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck, engine and content tests, UI component tests
        run: pnpm typecheck && pnpm test
      - name: build the static site
        run: pnpm build
      - name: end-to-end smoke test on the built site (level 0, no network)
        run: |
          pnpm --filter @desk/web exec playwright install --with-deps chromium
          pnpm --filter @desk/web e2e --project=smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    # GitHub Pages needs a public repository on the free plan; while the repo is private the site is built and tested but not deployed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
